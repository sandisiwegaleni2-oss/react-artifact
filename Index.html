:root{
  --yellow:#F4CE14;
  --green:#495E57;
  --green-deep:#33443F;
  --cream:#EDEFEE;
  --ink:#333333;
  --orange:#EE9972;
  --paper:#FFFDF4;
  --line:#D9DDD9;
  --error:#B42318;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}
*{
  box-sizing:border-box
}
html{
  scroll-behavior:smooth
}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Karla',system-ui,-apple-system,Segoe UI,sans-serif
}
.font-display{
  font-family:'Markazi Text',Georgia,serif
}
button,a,input,select,textarea{
  font:inherit
}
a{
  color:inherit
}
:focus-visible{
  outline:3px solid var(--yellow);
  outline-offset:3px;
  border-radius:4px
}
.skip-link{
  position:absolute;
  left:-9999px;
  top:0;
  z-index:100;
  background:var(--yellow);
  color:#111;
  padding:.7rem 1rem;
  font-weight:800
}
.skip-link:focus{
  left:12px;
  top:12px
}
.hero-food{
  background:radial-gradient(circle at 30% 25%, #FFF6A8 0 8%, transparent 9%),radial-gradient(circle at 70% 40%, #F4CE14 0 18%, #EE9972 19% 22%, transparent 23%),linear-gradient(135deg,#A8C4A0,#495E57 58%,#253931);
  position:relative;
  overflow:hidden
}
.hero-food:after{
  content:"";
  position:absolute;
  inset:18% 8% 10%;
  border:2px dashed rgba(255,255,255,.55);
  border-radius:999px
}
.plate{
  position:absolute;
  inset:15% 10% 12%;
  background:radial-gradient(circle at 50% 42%, #fffdf4 0 52%, #EDEFEE 53% 68%, transparent 69%);
  box-shadow:0 24px 50px rgba(0,0,0,.28)
}
.food-dot{
  position:absolute;
  border-radius:999px
}
.card-shadow{
  box-shadow:0 12px 30px rgba(51,51,51,.10)
}
.grad-salad{
  background:linear-gradient(145deg,#9BC48A 0%,#5C8A4E 42%,#F4CE14 42.5%,#EE9972 78%,#495E57 78.5%)
}
.grad-bruschetta{
  background:linear-gradient(145deg,#D9894A 0%,#A94E2D 48%,#F4CE14 48.5%,#495E57 84%,#FFF2C9 84.5%)
}
.grad-lemon{
  background:linear-gradient(145deg,#FFF0A2 0%,#F4CE14 48%,#EE9972 78%,#495E57 78.5%)
}
.grad-about1{
  background:linear-gradient(145deg,#495E57,#A8C4A0 55%,#F4CE14 90%)
}
.grad-about2{
  background:linear-gradient(145deg,#EE9972,#F4CE14 52%,#495E57)
}
input,select,textarea{
  width:100%;
  border:1.5px solid #C8CECB;
  background:#fff;
  border-radius:10px;
  padding:.72rem .85rem;
  color:#222
}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{
  border-color:var(--error);
  box-shadow:0 0 0 2px rgba(180,35,24,.12)
}
input[type="range"]{
  padding:0;
  accent-color:#495E57
}
.toast{
  animation:toastIn .25s ease-out
}
@keyframes toastIn{
  from{
    transform:translateY(10px);
    opacity:0
  }
  to{
    transform:translateY(0);
    opacity:1
  }
}
@media (prefers-color-scheme: dark){

}
